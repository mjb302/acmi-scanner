name: Supabase keep-alive

# Free-tier Supabase projects are paused after 7 days without activity.
# Anonymous pings of auth/v1/settings and a 401 on REST did NOT count:
# the project was paused on 19 Oct and again on 26 Oct 2026 despite daily
# successful pings. This version writes a row to public.keepalive with the
# service role key (GitHub secret SUPABASE_SERVICE_ROLE_KEY), which is a real
# database transaction, and prunes rows older than 30 days. The timestamp
# commit keeps the repo active so GitHub does not disable the schedule.

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://goqcrklierhzeluvwhgq.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret is present
        run: test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Write a keepalive row (real database activity)
        run: |
          set -e
          code=$(curl -s -o /tmp/ins.txt -w "%{http_code}" -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"source\":\"github-actions\",\"run_id\":\"${GITHUB_RUN_ID}\"}" \
            "$SUPABASE_URL/rest/v1/keepalive")
          echo "insert -> $code: $(head -c 200 /tmp/ins.txt)"
          test "$code" = "201"

      - name: Prune keepalive rows older than 30 days
        run: |
          cutoff=$(date -u -d '30 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?pinged_at=lt.$cutoff")
          echo "prune -> $code"
          test "$code" = "204" -o "$code" = "200"

      - name: Read back the latest row (REST select)
        run: |
          curl -s -f \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/keepalive?select=pinged_at,source&order=pinged_at.desc&limit=1"

      - name: Record timestamp (keeps the schedule enabled)
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/supabase-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/supabase-keepalive.txt
          git commit -m "Supabase keep-alive ping" || exit 0
          git push
